<!DOCTYPE html>
<html>
<head>
    <title>Predict Student Score</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
   <div class="container">
        <div class="header">
            <span class="ai-badge">🤖 AI Powered</span>
            <h2>Student Score Predictor</h2>
            <p>Enter student information to predict exam performance</p>
        </div>

        <form method="POST">
            <div class="grid-2">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" placeholder="18" required>
                </div>

                <div class="form-group">
                    <label for="study_hours">Study Hours</label>
                    <input type="number" id="study_hours" name="study_hours" placeholder="5" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="class_attendance">Class Attendance (%)</label>
                    <input type="number" id="class_attendance" name="class_attendance" placeholder="85" required>
                </div>

                <div class="form-group">
                    <label for="sleep_hours">Sleep Hours</label>
                    <input type="number" id="sleep_hours" name="sleep_hours" placeholder="7" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <input type="text" id="gender" name="gender" placeholder="Male/Female" required>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input type="text" id="course" name="course" placeholder="Computer Science" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="internet_access">Internet Access</label>
                    <input type="text" id="internet_access" name="internet_access" placeholder="yes/no" required>
                </div>

                <div class="form-group">
                    <label for="sleep_quality">Sleep Quality</label>
                    <input type="text" id="sleep_quality" name="sleep_quality" placeholder="poor/average/good" required>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="study_method">Study Method</label>
                    <input type="text" id="study_method" name="study_method" placeholder="Online/Offline" required>
                </div>

                <div class="form-group">
                    <label for="facility_rating">Facility Rating</label>
                    <input type="text" id="facility_rating" name="facility_rating" placeholder="1-5" required>
                </div>
            </div>

            <div class="form-group">
                <label for="exam_difficulty">Exam Difficulty</label>
                <input type="text" id="exam_difficulty" name="exam_difficulty" placeholder="Easy/Medium/Hard" required>
            </div>

            <button type="submit" class="submit-btn">Predict Score</button>
        </form>

        {% if prediction is not none %}
        <div class="prediction-result">
            <h3>Predicted Exam Score</h3>
            <div class="prediction-score">{{ prediction }}</div>
        </div>
        <h4>Suggestions to Improve:</h4>
            <ul>
            {% for suggestion in suggestions %}
                <li>{{ suggestion }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    </div>
</body>
</html>
