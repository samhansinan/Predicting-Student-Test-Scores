name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      # Skip DB-related tests
      - name: Build & Test (skip DAO tests)
        run: mvn -B test -Dtest="!CustomerDAOTest"

      # Optional build package
      - name: Package
        run: mvn -B package -DskipTests
